// Resolve Fabric Loom once at the top level so both Stonecutter trees share its classes.
plugins {
    id 'net.fabricmc.fabric-loom' apply false
}

subprojects {
    group = 'dev.someoneok'
    version = '0.1.0'

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
            withSourcesJar()
            withJavadocJar()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}

// Keep this list in sync with the versions in settings.gradle.
def crystalConfigVersions = ['26.1', '26.2', '26.3']

tasks.register('buildModWithSources') {
    group = 'build'
    description = 'Builds and collects CrystalConfig jars and combined sources jars for every supported Minecraft version.'
    dependsOn crystalConfigVersions.collect { version -> ":crystal-config:${version}:buildAndCollect" }
}

tasks.register('publishModToMavenLocal') {
    group = 'publishing'
    description = 'Publishes every supported CrystalConfig Minecraft version to Maven Local.'
    dependsOn crystalConfigVersions.collect { version -> ":crystal-config:${version}:publishToMavenLocal" }
}

// Build all version-specific testing mods from the same source tree.
tasks.register('buildConfigTester') {
    group = 'build'
    description = 'Build and collect 26.1, 26.2, and 26.3 CrystalConfig tester jars.'
    dependsOn crystalConfigVersions.collect { version -> ":config-tester:${version}:buildAndCollect" }
}
