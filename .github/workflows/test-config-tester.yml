name: Build CrystalConfig tester

on:
  push:
    branches: ["main", "master"]
    paths:
      - "config-tester/**"
      - "core/**"
      - "render-api/**"
      - "bridge-minecraft/**"
      - "crystal-config/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/test-config-tester.yml"
  pull_request:
    paths:
      - "config-tester/**"
      - "core/**"
      - "render-api/**"
      - "bridge-minecraft/**"
      - "crystal-config/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/test-config-tester.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tester:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build test mod with Stonecutter
        run: bash gradlew ":config-tester:${{ matrix.minecraft }}:buildAndCollect" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: crystalconfig-tester-mc${{ matrix.minecraft }}
          path: config-tester/build/libs/crystalconfig-tester-0.1.0-mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
