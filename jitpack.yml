before_install:
  - chmod +x gradlew
  - |
    set -e
    JAVA_25_VERSION="$(sdk list java | awk '/25\..*-tem/ && $NF ~ /25\..*-tem/ { print $NF; exit }')"
    if [ -z "$JAVA_25_VERSION" ]; then
      JAVA_25_VERSION="$(sdk list java | awk '/25\..*-open/ && $NF ~ /25\..*-open/ { print $NF; exit }')"
    fi
    if [ -z "$JAVA_25_VERSION" ]; then
      JAVA_25_VERSION="25-open"
    fi
    sdk install java "$JAVA_25_VERSION" || true
    sdk default java "$JAVA_25_VERSION"
    java -version

install:
  # Build all six distributable JARs, then publish all three versioned
  # modules and the Minecraft 26.1 compatibility alias.
  - ./gradlew --no-daemon buildModWithSources publishModToMavenLocal --stacktrace
  - |
    set -eu
    if [ -z "${VERSION:-}" ]; then
      echo "JitPack did not provide VERSION" >&2
      exit 1
    fi
    MOD_VERSION="$(awk -F= '$1 == "mod_version" { gsub(/\r/, "", $2); print $2; exit }' gradle.properties)"
    if [ -z "$MOD_VERSION" ]; then
      echo "gradle.properties has no mod_version" >&2
      exit 1
    fi
    python3 tools/verify_release_artifacts.py --mod-version "$MOD_VERSION" --maven-version "$VERSION"
